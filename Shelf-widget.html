<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bookshelf</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    color: #1C2B2D;
    padding: 22px 20px 26px;
    overflow-x: hidden;
    letter-spacing: -0.01em;
  }

  /* ── 읽는 중인 책 ─────────────────────── */
  .reading { position: relative; margin-bottom: 46px; }
  .reading-inner {
    display: flex;
    align-items: flex-end;
    gap: 46px;
    padding: 0 62px;
  }
  .rcover { flex-shrink: 0; }
  .rcover img {
    display: block;
    width: 132px;
    height: auto;
    border-radius: 2px 6px 6px 2px;
    box-shadow: 2px 2px 6px rgba(0,0,0,.1), 4px 4px 12px rgba(0,0,0,.07);
  }
  .rcover .ph {
    width: 132px; height: 200px;
    background: #EFEFE9;
    border-radius: 2px 6px 6px 2px;
    box-shadow: 2px 2px 6px rgba(0,0,0,.1), 4px 4px 12px rgba(0,0,0,.07);
  }
  .rinfo { flex: 1; min-width: 0; padding-bottom: 34px; }
  .rtitle { font-size: 16px; font-weight: 700; line-height: 1.4; margin-bottom: 16px; }
  .rtitle em { font-style: normal; font-weight: 400; color: #8A918D; }
  .rbar { height: 5px; background: #EDEAE0; border-radius: 3px; overflow: hidden; margin-bottom: 7px; }
  .rfill { height: 100%; background: #1C2B2D; border-radius: 3px; transition: width .35s ease; }
  .rtext {
    display: flex; justify-content: space-between;
    font-size: 12px; color: #A8ADA9;
    padding-bottom: 13px;
    border-bottom: 1px solid #EAECE6;
    margin-bottom: 14px;
  }
  .rctl { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .rpage { font-size: 15px; font-weight: 700; cursor: pointer; }
  .rbtns { display: flex; gap: 6px; }
  .rbtn {
    padding: 6px 11px;
    border-radius: 6px;
    border: 1px solid #E2E5DF;
    background: #fff;
    color: #1C2B2D;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .rbtn:hover { background: #1C2B2D; color: #fff; border-color: #1C2B2D; }
  .rbtn:disabled { opacity: .4; cursor: default; }
  .rbtn.ghost { color: #A8ADA9; font-size: 11px; padding: 6px 9px; }
  .rnav {
    position: absolute;
    bottom: 26px;
    background: none; border: 0;
    font-size: 19px; line-height: 1;
    color: #C4C9C3;
    cursor: pointer;
    padding: 4px 8px;
    transition: color .15s;
  }
  .rnav:hover { color: #1C2B2D; }
  .rnav:disabled { opacity: .25; cursor: default; }
  .rnav.prev { left: 6px; }
  .rnav.next { right: 6px; }
  .rempty { text-align: center; color: #A8ADA9; font-size: 13px; padding: 30px 0; }

  /* ── 별점 모달 ─────────────────────────── */
  .ovl {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 200;
    align-items: flex-end;
  }
  .ovl.open { display: flex; }
  .modal { background: #fff; border-radius: 18px 18px 0 0; padding: 22px 20px 36px; width: 100%; }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
  .modal p { font-size: 13px; color: #A8ADA9; margin-bottom: 18px; }
  .rateops { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .rateop {
    padding: 11px 15px; border-radius: 9px;
    border: 1.5px solid #E2E5DF; background: #fff;
    font: inherit; font-size: 15px; cursor: pointer; text-align: left;
    transition: all .15s;
  }
  .rateop:hover { border-color: #1C2B2D; }
  .rateop.sel { border-color: #1C2B2D; background: #1C2B2D; color: #fff; }
  .rateok {
    width: 100%; padding: 13px; border-radius: 9px; border: 0;
    background: #1C2B2D; color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .rateok:disabled { opacity: .4; }
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: #1C2B2D; color: #fff;
    padding: 8px 18px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity .3s;
    pointer-events: none; white-space: nowrap; z-index: 300;
  }
  .toast.show { opacity: 1; }

  /* ── 선반 ─────────────────────────────── */
  .shelf-unit { margin-bottom: 16px; }
  .shelf {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    min-height: 150px;
    padding-bottom: 0;
  }
  .board {
    height: 4px;
    background: #2A3A3B;
    border-radius: 2px;
    margin: 0 4px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.13);
  }

  /* ── 책등 ─────────────────────────────── */
  .spine {
    position: relative;
    border-radius: 1px 1px 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 7px 2px 9px;
    overflow: hidden;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.22s cubic-bezier(.22,.9,.3,1), box-shadow 0.22s ease;
    background: #C8CCC5;
  }
  .spine:hover {
    transform: translateY(-11px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.18);
  }
  .spine .stars { display: flex; gap: 2px; flex-shrink: 0; }
  .spine .stars i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .8; }
  .spine .twrap { flex: 1; position: relative; width: 100%; }
  .spine .t {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(90deg);
    font-size: 8px;
    font-weight: 500;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: left;
  }
  .spine .obi {
    position: absolute;
    left: 0; right: 0;
    pointer-events: none;
  }
  .spine.nopage { opacity: .55; }

  /* ── 팝업 ─────────────────────────────── */
  .popup {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 14px 44px rgba(0,0,0,0.24);
    padding: 20px;
    width: 300px;
    z-index: 999;
    pointer-events: none;
  }
  .popup.show { display: block; }
  .pbody { display: flex; gap: 14px; align-items: stretch; }
  .pcover {
    width: 84px; height: auto;
    object-fit: contain;
    border-radius: 2px 5px 5px 2px;
    box-shadow: 2px 2px 6px rgba(0,0,0,.1), 4px 4px 12px rgba(0,0,0,.07);
    flex-shrink: 0;
  }
  .pinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ptitle { font-size: 13px; font-weight: 700; line-height: 1.4; margin-bottom: 9px; }
  .pmeta { font-size: 11px; color: #7C837F; margin-bottom: 4px; }
  .pbottom { margin-top: auto; }
  .pstars { font-size: 12px; color: #E0A93C; }
  .pdate { font-size: 11px; color: #A8ADA9; }
  .ppage { font-size: 11px; color: #A8ADA9; }

  /* ── 하단 요약 ─────────────────────────── */
  .foot {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 14px;
    font-size: 11.5px;
    color: #7C837F;
  }
  .foot span { white-space: nowrap; }
  .gear {
    position: relative;
    display: inline-flex;
    align-items: center;
    cursor: pointer;
    color: #A8ADA9;
    line-height: 1;
  }
  .gear:hover { color: #4A5450; }
  .gear svg { width: 13px; height: 13px; display: block; }
  .menu {
    display: none;
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 6px 22px rgba(0,0,0,.18);
    padding: 5px;
    z-index: 50;
    min-width: 116px;
  }
  .menu.show { display: block; }
  .menu button {
    display: block;
    width: 100%;
    border: 0;
    background: none;
    text-align: left;
    font: inherit;
    font-size: 11.5px;
    color: #3A4442;
    padding: 6px 9px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .menu button:hover { background: #F0F2EE; }
  .menu button.on { font-weight: 700; }

  .msg { text-align: center; color: #A8ADA9; font-size: 13px; padding: 44px 0; }
</style>
</head>
<body>

<div class="reading" id="reading"></div>

<div id="stage"><div class="msg">불러오는 중...</div></div>

<div class="ovl" id="ovl">
  <div class="modal">
    <h3 id="rateTitle"></h3>
    <p>별점을 선택해주세요</p>
    <div class="rateops">
      <button class="rateop" data-rating="★★★★★">★★★★★</button>
      <button class="rateop" data-rating="★★★★">★★★★</button>
      <button class="rateop" data-rating="★★★">★★★</button>
      <button class="rateop" data-rating="★★">★★</button>
      <button class="rateop" data-rating="★">★</button>
    </div>
    <button class="rateok" id="rateOk" disabled>완독 완료</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="popup" id="popup">
  <div class="pbody">
    <img class="pcover" id="pCover" src="" alt="">
    <div class="pinfo">
      <div>
        <div class="ptitle" id="pTitle"></div>
        <div class="pmeta" id="pAuthor"></div>
        <div class="pmeta" id="pPub"></div>
      </div>
      <div class="pbottom">
        <div class="pstars" id="pStars"></div>
        <div class="ppage" id="pPage"></div>
        <div class="pdate" id="pDate"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── 설정 ────────────────────────────────────────
// ?color=cover  표지에서 뽑은 색 (기본)
// ?color=palette  지정 팔레트
// ?perShelf=18  한 칸에 꽂을 권수
const qs = new URLSearchParams(location.search);
const PER_SHELF = parseInt(qs.get('perShelf')) || 40;
const YEAR = qs.get('year') || new Date().getFullYear();
const OBI_RATE = qs.has('obi') ? parseInt(qs.get('obi')) : 35;

// 색 테마 — cover(표지 추출) / mono(모노톤) / pastel(파스텔톤)
const THEME_KEY = 'shelfTheme:v1';
let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch {}
let COLOR_MODE = qs.get('color') || savedTheme || 'cover';

const MONO = ['#2B2B29','#3E3E3B','#52524E','#666660','#7C7C75','#93938B','#ABABA2','#C2C2B9','#D6D6CD'];
const PASTEL = ['#EFC3B8','#F2DCA9','#CDE0C4','#BFD8E6','#D8CCE6','#EED6C2','#C9DED3','#E8C7D2','#D4D9EC','#EAD9B7'];

function hexToRgb(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

function hashJitter(str, range) {
  // FNV-1a + 마무리 믹싱 — 한글 제목에서도 고르게 흩어지도록
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  h ^= h >>> 15; h = Math.imul(h, 2246822507);
  h ^= h >>> 13; h = Math.imul(h, 3266489909);
  h ^= h >>> 16;
  return (h >>> 0) % range;
}

// 밝기로 글자색 정하기
function textOn(rgb) {
  const [r, g, b] = rgb;
  const L = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return L > 0.58 ? 'rgba(20,26,26,.92)' : 'rgba(255,255,255,.94)';
}

// 표지에서 대표색과 두 번째 색 뽑기
// 한 번 뽑은 색은 브라우저에 저장해두고 다음부터는 그대로 씁니다
const CACHE_KEY = 'shelfColors:v1';
let colorCache = {};
try { colorCache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch { colorCache = {}; }
let cacheDirty = false;
function saveCache() {
  if (!cacheDirty) return;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(colorCache)); } catch {}
  cacheDirty = false;
}
function dist(a, b) {
  return Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2);
}
async function dominantColor(url) {
  if (colorCache[url]) return colorCache[url];
  try {
    const r = await fetch('/api/image-proxy?url=' + encodeURIComponent(url));
    const d = await r.json();
    if (!d.dataUrl) return null;
    const out = await new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = 40; c.height = 40;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, 40, 40);
          const px = ctx.getImageData(0, 0, 40, 40).data;
          const bins = {};
          for (let i = 0; i < px.length; i += 4) {
            const r0 = px[i], g0 = px[i+1], b0 = px[i+2];
            const mx = Math.max(r0,g0,b0), mn = Math.min(r0,g0,b0);
            // 흰 여백과 검은 테두리는 제외
            if (mx > 238 && mn > 224) continue;
            if (mx < 26) continue;
            const key = (r0>>5) + ',' + (g0>>5) + ',' + (b0>>5);
            if (!bins[key]) bins[key] = { n:0, r:0, g:0, b:0, sat:0 };
            const bn = bins[key];
            bn.n++; bn.r += r0; bn.g += g0; bn.b += b0;
            bn.sat += (mx - mn);
          }
          // 많이 나오면서 채도도 있는 쪽부터 정렬
          const ranked = Object.values(bins)
            .map(bn => ({
              rgb: [Math.round(bn.r/bn.n), Math.round(bn.g/bn.n), Math.round(bn.b/bn.n)],
              score: bn.n * (1 + (bn.sat / bn.n) / 190)
            }))
            .sort((a, b) => b.score - a.score);

          if (!ranked.length) return resolve(null);
          const main = ranked[0].rgb;
          // 대표색과 충분히 다른 색을 두 번째로 고른다
          const second = (ranked.find(x => dist(x.rgb, main) > 55) || {}).rgb || null;
          resolve({ main, second });
        } catch { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = d.dataUrl;
    });
    colorCache[url] = out;
    cacheDirty = true;
    return out;
  } catch { return null; }
}
// 두 번째 색이 없을 때 대표색에서 파생
function shiftShade(rgb) {
  const L = (0.299*rgb[0] + 0.587*rgb[1] + 0.114*rgb[2]) / 255;
  const f = L > 0.5 ? 0.62 : 1.55;
  return rgb.map(v => Math.max(0, Math.min(255, Math.round(v * f))));
}

function stars(v) {
  if (!v) return '';
  const n = parseInt(v);
  if (isNaN(n)) return String(v);
  return '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n));
}
function fmtDate(d) {
  if (!d) return '';
  const t = new Date(d);
  return t.getFullYear() + '년 ' + (t.getMonth()+1) + '월 ' + t.getDate() + '일';
}

// 팝업
const pop = document.getElementById('popup');
function showPop(b) {
  document.getElementById('pCover').src = b.url || '';
  document.getElementById('pTitle').textContent = b.title || '';
  document.getElementById('pAuthor').textContent = b.author || '';
  document.getElementById('pPub').textContent = b.publisher || '';
  document.getElementById('pStars').textContent = stars(b.rating);
  document.getElementById('pPage').textContent = b.totalPage ? b.totalPage + '쪽' : '페이지 수 없음';
  document.getElementById('pDate').textContent = fmtDate(b.date);
  pop.classList.add('show');
}
function hidePop() { pop.classList.remove('show'); }


// ─────────────────────────────────────────────
// 읽는 중인 책
// ─────────────────────────────────────────────
let reading = [];
let curIdx = 0;
let finishing = null;
let pickedRating = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function pctOf(b) {
  if (!b.totalPage) return 0;
  return Math.min(100, Math.round(b.currentPage / b.totalPage * 100));
}

function renderReading() {
  const box = document.getElementById('reading');
  if (!reading.length) { box.innerHTML = ''; return; }

  const b = reading[curIdx];
  const p = pctOf(b);
  const pageText = b.totalPage ? b.currentPage + 'p / ' + b.totalPage + 'p' : b.currentPage + 'p';
  const many = reading.length > 1;

  box.innerHTML =
    (many ? '<button class="rnav prev" id="rPrev">&#8249;</button>' : '') +
    (many ? '<button class="rnav next" id="rNext">&#8250;</button>' : '') +
    '<div class="reading-inner">' +
      '<div class="rcover">' +
        (b.cover ? '<img src="' + b.cover + '" alt="">' : '<div class="ph"></div>') +
      '</div>' +
      '<div class="rinfo">' +
        '<div class="rtitle">' + (b.title || '') +
          (b.author ? ', <em>' + b.author + '</em>' : '') + '</div>' +
        '<div class="rbar"><div class="rfill" id="rFill" style="width:' + p + '%"></div></div>' +
        '<div class="rtext">' +
          '<span id="rPageText">' + pageText + '</span>' +
          '<span id="rPct">' + (b.totalPage ? p + '%' : '') + '</span>' +
        '</div>' +
        '<div class="rctl">' +
          '<div class="rpage" id="rPage" title="클릭해서 직접 입력">' + b.currentPage + 'p</div>' +
          '<div class="rbtns">' +
            '<button class="rbtn" data-add="1">+1</button>' +
            '<button class="rbtn" data-add="5">+5</button>' +
            '<button class="rbtn" data-add="10">+10</button>' +
            '<button class="rbtn ghost" id="rFinish">완독</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="board"></div>';

  if (many) {
    const prev = document.getElementById('rPrev');
    const next = document.getElementById('rNext');
    prev.disabled = curIdx === 0;
    next.disabled = curIdx === reading.length - 1;
    prev.addEventListener('click', () => { curIdx--; renderReading(); });
    next.addEventListener('click', () => { curIdx++; renderReading(); });
  }

  box.querySelectorAll('.rbtn[data-add]').forEach(btn => {
    btn.addEventListener('click', () => addPage(parseInt(btn.dataset.add)));
  });
  document.getElementById('rFinish').addEventListener('click', () => openRating(b));
  document.getElementById('rPage').addEventListener('click', editPage);
}

function refreshProgress(b, val) {
  const p = pctOf(b);
  document.getElementById('rFill').style.width = p + '%';
  document.getElementById('rPageText').textContent =
    b.totalPage ? val + 'p / ' + b.totalPage + 'p' : val + 'p';
  if (b.totalPage) document.getElementById('rPct').textContent = p + '%';
}

async function addPage(amount) {
  const b = reading[curIdx];
  const val = b.currentPage + amount;
  b.currentPage = val;

  refreshProgress(b, val);
  document.getElementById('rPage').textContent = val + 'p';

  const btns = document.querySelectorAll('.rbtn[data-add]');
  btns.forEach(x => x.disabled = true);
  try {
    const r = await fetch('/api/book-reading', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pageId: b.pageId, currentPage: val }),
    });
    const d = await r.json();
    toast(d.success ? val + 'p 저장됐어요' : '저장 실패 :(');
  } catch { toast('오류가 발생했어요'); }
  finally { btns.forEach(x => x.disabled = false); }
}

function editPage() {
  const b = reading[curIdx];
  const el = document.getElementById('rPage');
  const input = document.createElement('input');
  input.type = 'number';
  input.value = b.currentPage;
  input.min = 0;
  input.style.cssText = 'width:74px;font:inherit;font-size:15px;font-weight:700;border:0;border-bottom:1.5px solid #1C2B2D;outline:none;background:transparent;color:#1C2B2D;';
  el.replaceWith(input);
  input.focus(); input.select();

  const done = async () => {
    const val = parseInt(input.value);
    const ok = !isNaN(val) && val >= 0;
    if (ok) b.currentPage = val;

    const div = document.createElement('div');
    div.className = 'rpage';
    div.id = 'rPage';
    div.title = '클릭해서 직접 입력';
    div.textContent = b.currentPage + 'p';
    div.addEventListener('click', editPage);
    input.replaceWith(div);

    if (!ok) return;
    refreshProgress(b, val);
    try {
      await fetch('/api/book-reading', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pageId: b.pageId, currentPage: val }),
      });
      toast(val + 'p 저장됐어요');
    } catch { toast('오류가 발생했어요'); }
  };

  input.addEventListener('blur', done);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
}

function openRating(b) {
  finishing = b;
  pickedRating = null;
  document.getElementById('rateTitle').textContent = b.title || '';
  document.querySelectorAll('.rateop').forEach(x => x.classList.remove('sel'));
  document.getElementById('rateOk').disabled = true;
  document.getElementById('ovl').classList.add('open');
}

document.addEventListener('click', e => {
  const op = e.target.closest('.rateop');
  if (!op) return;
  document.querySelectorAll('.rateop').forEach(x => x.classList.remove('sel'));
  op.classList.add('sel');
  pickedRating = op.dataset.rating;
  document.getElementById('rateOk').disabled = false;
});

document.getElementById('ovl').addEventListener('click', e => {
  if (e.target.id === 'ovl') document.getElementById('ovl').classList.remove('open');
});

document.getElementById('rateOk').addEventListener('click', async () => {
  if (!finishing || !pickedRating) return;
  const btn = document.getElementById('rateOk');
  btn.disabled = true;
  btn.textContent = '저장 중...';
  try {
    const r = await fetch('/api/book-reading', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pageId: finishing.pageId,
        finish: true,
        rating: pickedRating,
        totalPage: finishing.totalPage,
      }),
    });
    const d = await r.json();
    if (d.success) {
      document.getElementById('ovl').classList.remove('open');
      toast('완독 완료!');
      setTimeout(() => {
        reading = reading.filter(x => x.pageId !== finishing.pageId);
        if (curIdx >= reading.length) curIdx = Math.max(0, reading.length - 1);
        renderReading();
        btn.textContent = '완독 완료';
      }, 1400);
    } else {
      toast('저장 실패 :(');
      btn.disabled = false; btn.textContent = '완독 완료';
    }
  } catch {
    toast('오류가 발생했어요');
    btn.disabled = false; btn.textContent = '완독 완료';
  }
});

(async () => {
  try {
    const r = await fetch('/api/book-reading');
    const list = await r.json();
    if (Array.isArray(list)) {
      reading = list.sort((a, b) => (b.totalPage || 0) - (a.totalPage || 0));
      renderReading();
    }
  } catch {}
})();

// ── 그리기 ──────────────────────────────────────
(async () => {
  const stage = document.getElementById('stage');

  try {
    const r = await fetch('/api/reading-stats?year=' + YEAR);
    const d = await r.json();
    if (d.error) { stage.innerHTML = '<div class="msg">' + d.error + '</div>'; return; }

    const books = [...(d.fictionCovers||[]), ...(d.nonfictionCovers||[])]
      .sort((a,b) => ((a.date||'9999') < (b.date||'9999') ? -1 : 1));

    if (!books.length) { stage.innerHTML = '<div class="msg">아직 기록된 책이 없어요</div>'; return; }

    // 선반 나누기
    const shelves = [];
    for (let i = 0; i < books.length; i += PER_SHELF) shelves.push(books.slice(i, i + PER_SHELF));

    stage.innerHTML = shelves.map(() =>
      '<div class="shelf-unit"><div class="shelf"></div><div class="board"></div></div>'
    ).join('');

    const shelfEls = stage.querySelectorAll('.shelf');
    const rendered = [];
    let prevObi = false;

    shelves.forEach((group, si) => {
      const el = shelfEls[si];
      group.forEach(b => {
        const pages = b.totalPage || 0;
        const w = pages
          ? Math.max(22, Math.min(58, Math.round(pages * 0.076)))
          : 28;
        const h = 168 + hashJitter(b.title || b.pageId, 34);

        const s = document.createElement('div');
        s.className = 'spine' + (pages ? '' : ' nopage');
        s.style.width = w + 'px';
        s.style.height = h + 'px';

        const dots = '<i></i>'.repeat(parseInt(b.rating) || 0);

        // 띠지 — 제목 기준 고정 랜덤, 단 바로 옆 책과 연달아 붙지 않게
        let hasObi = hashJitter((b.title || '') + 'obi', 100) < OBI_RATE;
        if (prevObi) hasObi = false;
        prevObi = hasObi;

        const obiH = hasObi ? 34 + hashJitter((b.title || '') + 'h', 17) : 0;
        const gap = hasObi ? Math.max(0, obiH - 9) : 0;

        s.innerHTML =
          '<div class="stars">' + dots + '</div>' +
          '<div class="twrap"' + (hasObi ? ' style="margin-bottom:' + gap + 'px"' : '') + '>' +
            '<div class="t" style="width:' + (h - 34 - gap) + 'px">' + (b.title || '') + '</div>' +
          '</div>' +
          (hasObi
            ? '<div class="obi" style="height:' + obiH + 'px;bottom:0"></div>'
            : '');

        s.addEventListener('mouseenter', () => showPop(b));
        s.addEventListener('mouseleave', hidePop);
        el.appendChild(s);

        rendered.push({ s, obiEl: s.querySelector('.obi'), url: b.url, key: b.title || b.pageId });
      });
    });

    // 요약
    const totalPages = books.reduce((a, b) => a + (b.totalPage || 0), 0);
    const cm = (totalPages * 0.1 / 10).toFixed(1);
    const foot = document.createElement('div');
    foot.className = 'foot';
    foot.innerHTML =
      '<span style="font-weight:700;color:#1C2B2D">' + YEAR + '</span>' +
      '<span>' + books.length + '권</span>' +
      '<span>' + totalPages.toLocaleString() + '쪽</span>' +
      '<span>약 ' + cm + 'cm</span>' +
      '<span class="gear" id="gear" title="색 테마">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<circle cx="12" cy="12" r="3"></circle>' +
          '<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>' +
        '</svg>' +
        '<span class="menu" id="menu">' +
          '<button data-mode="cover">책 표지색</button>' +
          '<button data-mode="mono">모노톤</button>' +
          '<button data-mode="pastel">파스텔톤</button>' +
        '</span>' +
      '</span>';
    stage.appendChild(foot);

    // ── 색 입히기 ────────────────────────────────
    const paint = (p, main, second) => {
      p.s.style.background = 'rgb(' + main.join(',') + ')';
      p.s.style.color = textOn(main);
      if (p.obiEl) p.obiEl.style.background = 'rgb(' + (second || shiftShade(main)).join(',') + ')';
    };

    let paintToken = 0;
    async function applyTheme(mode) {
      COLOR_MODE = mode;
      try { localStorage.setItem(THEME_KEY, mode); } catch {}
      document.querySelectorAll('#menu button').forEach(btn => {
        btn.classList.toggle('on', btn.dataset.mode === mode);
      });

      const myToken = ++paintToken;

      if (mode === 'mono' || mode === 'pastel') {
        const set = mode === 'mono' ? MONO : PASTEL;
        rendered.forEach(p => {
          const main = hexToRgb(set[hashJitter(p.key + mode, set.length)]);
          paint(p, main, shiftShade(main));
        });
        return;
      }

      // cover — 저장돼 있는 건 즉시, 나머지는 6권씩 동시에
      const todo = [];
      for (const p of rendered) {
        if (!p.url) continue;
        const c = colorCache[p.url];
        if (c && c.main) paint(p, c.main, c.second);
        else todo.push(p);
      }

      let cursor = 0;
      await Promise.all(
        Array.from({ length: Math.min(6, todo.length) }, async () => {
          while (cursor < todo.length) {
            const p = todo[cursor++];
            const c = await dominantColor(p.url);
            if (myToken !== paintToken) return;
            if (c && c.main) paint(p, c.main, c.second);
          }
        })
      );
      saveCache();
    }

    // 설정 메뉴
    const gear = document.getElementById('gear');
    const menu = document.getElementById('menu');
    gear.addEventListener('click', e => {
      e.stopPropagation();
      menu.classList.toggle('show');
    });
    menu.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      e.stopPropagation();
      menu.classList.remove('show');
      applyTheme(btn.dataset.mode);
    });
    document.addEventListener('click', () => menu.classList.remove('show'));

    applyTheme(COLOR_MODE);

  } catch (e) {
    stage.innerHTML = '<div class="msg">불러올 수 없어요 :(</div>';
  }
})();
</script>
</body>
</html>
