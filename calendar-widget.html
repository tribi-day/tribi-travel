<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reading calendar</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    color: #1A1A1A;
    padding: 24px 22px 30px;
    letter-spacing: -0.01em;
  }

  /* ── 헤더 ─────────────────────────────── */
  .top {
    display: flex;
    align-items: baseline;
    gap: 18px;
    margin-bottom: 26px;
  }
  .month {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.045em;
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 3px;
    border-bottom: 1px solid #1A1A1A;
  }
  .nav button {
    background: none; border: 0;
    font: inherit; font-size: 15px;
    color: #9A9A9A;
    cursor: pointer;
    line-height: 1;
    padding: 2px 1px;
    transition: color .15s;
  }
  .nav button:hover { color: #1A1A1A; }
  .nav .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #C8C8C8;
    cursor: pointer;
  }
  .nav .dot:hover { background: #1A1A1A; }

  /* ── 요일 ─────────────────────────────── */
  .toggles {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 9px;
    align-self: center;
  }
  .toggles button {
    display: flex; align-items: center; justify-content: center;
    background: none;
    border: 0;
    color: #D2D2D2;
    cursor: pointer;
    padding: 3px;
    transition: color .15s;
  }
  .toggles button:hover { color: #9A9A9A; }
  .toggles button.on { color: #1A1A1A; }

  .dow {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 12px;
  }
  .dow span {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: #9A9A9A;
    text-transform: uppercase;
  }

  /* ── 주 ───────────────────────────────── */
  .week { position: relative; margin-bottom: 4px; }
  .cells {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .cell {
    border-top: 1px solid #1A1A1A;
    padding-top: 9px;
    min-height: 104px;
  }
  .cell.out { border-top-color: #E4E4E4; }
  .num {
    font-size: 16px;
    font-weight: 400;
    color: #1A1A1A;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .cell.out .num { color: #CFCFCF; }
  .cell.today .num { font-weight: 700; }

  /* ── 기간 막대 ─────────────────────────── */
  .lanes {
    position: absolute;
    left: 0; right: 0;
    top: 40px;
    pointer-events: none;
  }
  .bar {
    position: absolute;
    opacity: .3;
    z-index: 1;
    pointer-events: auto;
    cursor: default;
  }
  .bar.now { opacity: 1; }
  .cap {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 5;
    border-radius: 2px 4px 4px 2px;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.1), 4px 4px 12px rgba(0,0,0,0.07);
    display: block;
    pointer-events: auto;
    cursor: default;
  }
  .cap img { display: block; height: 100%; width: auto; border-radius: inherit; }
  .cap.ph { background: #EDEDED; }

  /* ── 팝업 ─────────────────────────────── */
  .popup {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 14px 44px rgba(0,0,0,0.24);
    padding: 20px;
    width: 300px;
    z-index: 99;
    pointer-events: none;
  }
  .popup.show { display: block; }
  .pbody { display: flex; gap: 14px; align-items: stretch; }
  .pcover {
    width: 84px; height: auto;
    object-fit: contain;
    border-radius: 2px 5px 5px 2px;
    box-shadow: 2px 2px 6px rgba(0,0,0,.1), 4px 4px 12px rgba(0,0,0,.07);
    flex-shrink: 0;
  }
  .pinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ptitle { font-size: 13px; font-weight: 700; line-height: 1.4; margin-bottom: 9px; }
  .pmeta { font-size: 11px; color: #8A8A8A; margin-bottom: 4px; }
  .pbottom { margin-top: auto; }
  .pstars { font-size: 12px; color: #1A1A1A; }
  .pdate { font-size: 11px; color: #ABABAB; }

  .msg { color: #ABABAB; font-size: 13px; padding: 40px 0; text-align: center; }

  @media (max-width: 560px) {
    body { padding: 18px 14px 24px; }
    .month { font-size: 23px; }
    .cell { min-height: 82px; }
    .num { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="month" id="monthLabel">—</div>
  <div class="nav">
    <button id="prev" title="이전 달">&#8249;</button>
    <div class="dot" id="today" title="이번 달"></div>
    <button id="next" title="다음 달">&#8250;</button>
  </div>
  <div class="toggles">
    <button id="tLine" title="기간 선 보기">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="6.5" width="14" height="3" fill="currentColor"/>
      </svg>
    </button>
    <button id="tCover" title="완독 표지 보기">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="4.2" y="2.6" width="7.7" height="10.9" fill="currentColor"/>
      </svg>
    </button>
  </div>
</div>

<div class="dow">
  <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span>
  <span>Fri</span><span>Sat</span><span>Sun</span>
</div>

<div id="grid"><div class="msg">불러오는 중...</div></div>

<div class="popup" id="popup">
  <div class="pbody">
    <img class="pcover" id="pCover" src="" alt="">
    <div class="pinfo">
      <div>
        <div class="ptitle" id="pTitle"></div>
        <div class="pmeta" id="pAuthor"></div>
        <div class="pmeta" id="pPub"></div>
      </div>
      <div class="pbottom">
        <div class="pstars" id="pStars"></div>
        <div class="pdate" id="pDate"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── 설정 ────────────────────────────────────────
// ?span=3   읽은 기간(일). 시작일 속성이 생기기 전까지 쓰는 임시값
const qs = new URLSearchParams(location.search);
const SPAN_RAW = qs.get('span') || '3';
const SPAN = parseInt(SPAN_RAW) || 3;
const SPAN_RANDOM = SPAN_RAW === 'random' || (qs.has('demo') && !qs.has('span'));

// 제목 기준 고정 랜덤 — 새로고침해도 같은 결과
function seed(str, range) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13;
  return (h >>> 0) % range;
}
// 짧은 책이 많고 가끔 긴 책이 나오도록
function spanOf(b) {
  if (!SPAN_RANDOM) return SPAN;
  const r = seed((b.title || b.pageId || '') + 'span', 100);
  if (r < 30) return 1 + seed(b.title || '', 2);        // 1~2일
  if (r < 70) return 3 + seed((b.title || '') + 'a', 4); // 3~6일
  if (r < 92) return 7 + seed((b.title || '') + 'b', 6); // 7~12일
  return 14 + seed((b.title || '') + 'c', 10);           // 14~23일
}

const BAR_H = parseInt(qs.get('bar')) || 8;      // 막대 굵기
const LANE_H = parseInt(qs.get('lane')) || (BAR_H + 4);  // 줄 간격 (겹치지 않게)
const CAP_W = parseInt(qs.get('cap')) || 60;      // 표지 가로 (고정)
const CAP_H = Math.round(CAP_W * 1.55);           // 칸 높이 계산용 표지 세로 어림값
const DEMO = parseInt(qs.get('demo')) || 0;       // 겹침 확인용 샘플 권수

let viewYear, viewMonth;   // 보고 있는 달 (month: 0-11)

// 보기 설정 — 선 / 표지 각각 껐다 켰다
const VIEW_KEY = 'calView:v1';
let showLine = true, showCover = true;
try {
  const v = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null');
  if (v) { showLine = !!v.line; showCover = !!v.cover; }
} catch {}
if (qs.has('line')) showLine = qs.get('line') !== '0';
if (qs.has('cover')) showCover = qs.get('cover') !== '0';
const yearCache = {};      // 연도별 책 목록

// ── 표지 색 ─────────────────────────────────────
const CACHE_KEY = 'calColors:v1';
let colorCache = {};
try { colorCache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch {}
let cacheDirty = false;
function saveCache() {
  if (!cacheDirty) return;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(colorCache)); } catch {}
  cacheDirty = false;
}

async function keyColor(url) {
  if (colorCache[url]) return colorCache[url];
  try {
    const r = await fetch('/api/image-proxy?url=' + encodeURIComponent(url));
    const d = await r.json();
    if (!d.dataUrl) return null;
    const rgb = await new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = 40; c.height = 40;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, 40, 40);
          const px = ctx.getImageData(0, 0, 40, 40).data;
          const bins = {};
          for (let i = 0; i < px.length; i += 4) {
            const r0 = px[i], g0 = px[i+1], b0 = px[i+2];
            const mx = Math.max(r0,g0,b0), mn = Math.min(r0,g0,b0);
            if (mx > 238 && mn > 224) continue;   // 흰 여백 제외
            if (mx < 26) continue;                // 검은 테두리 제외
            const k = (r0>>5) + ',' + (g0>>5) + ',' + (b0>>5);
            if (!bins[k]) bins[k] = { n:0, r:0, g:0, b:0, sat:0 };
            const b = bins[k];
            b.n++; b.r += r0; b.g += g0; b.b += b0;
            b.sat += (mx - mn);
          }
          let best = null;
          for (const k in bins) {
            const b = bins[k];
            const score = b.n * (1 + (b.sat / b.n) / 190);
            if (!best || score > best.score) best = { ...b, score };
          }
          if (!best) return resolve(null);
          resolve('rgb(' + Math.round(best.r/best.n) + ',' + Math.round(best.g/best.n) + ',' + Math.round(best.b/best.n) + ')');
        } catch { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = d.dataUrl;
    });
    colorCache[url] = rgb;
    cacheDirty = true;
    return rgb;
  } catch { return null; }
}

// ── 팝업 ────────────────────────────────────────
const popup = document.getElementById('popup');
function fmtDate(d) {
  if (!d) return '';
  const t = new Date(d);
  return t.getFullYear() + '년 ' + (t.getMonth()+1) + '월 ' + t.getDate() + '일';
}
function stars(v) {
  if (!v) return '';
  const n = parseInt(v);
  if (isNaN(n)) return String(v);
  return '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n));
}
function showPop(b) {
  document.getElementById('pCover').src = b.url || '';
  document.getElementById('pTitle').textContent = b.title || '';
  document.getElementById('pAuthor').textContent = b.author || '';
  document.getElementById('pPub').textContent = b.publisher || '';
  document.getElementById('pStars').textContent = stars(b.rating);
  document.getElementById('pDate').textContent = fmtDate(b.date);
  popup.classList.add('show');
}
function hidePop() { popup.classList.remove('show'); }

// ── 데이터 ──────────────────────────────────────
async function booksOf(year) {
  if (yearCache[year]) return yearCache[year];
  const r = await fetch('/api/reading-stats?year=' + year);
  const d = await r.json();
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const list = [...(d.fictionCovers||[]), ...(d.nonfictionCovers||[])]
    .map(b => {
      const ongoing = !b.date;                    // 완독일이 없으면 읽는 중
      const end = ongoing ? new Date(todayMid) : new Date(b.date + 'T00:00:00');
      if (isNaN(end)) return null;
      const start = new Date(end);
      start.setDate(start.getDate() - (spanOf(b) - 1));   // 임시: 시작일 속성이 생기기 전까지
      return { ...b, start, end, ongoing };
    })
    .filter(Boolean);
  yearCache[year] = list;
  return list;
}

// ── 그리기 ──────────────────────────────────────
function ymd(d) { return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function sameDay(a, b) { return ymd(a) === ymd(b); }

async function render() {
  const grid = document.getElementById('grid');
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('monthLabel').textContent =
    monthNames[viewMonth] + "' " + viewYear;

  let books = [];
  try {
    // 달 경계에서 이전/다음 해 책이 걸칠 수 있어 양쪽 다 불러온다
    const years = new Set([viewYear]);
    if (viewMonth === 0) years.add(viewYear - 1);
    if (viewMonth === 11) years.add(viewYear + 1);
    const lists = await Promise.all([...years].map(y => booksOf(y).catch(() => [])));
    books = lists.flat();

    if (DEMO > 0 && books.length) {
      const days = new Date(viewYear, viewMonth + 1, 0).getDate();
      const pool = [];
      while (pool.length < DEMO) pool.push(books[pool.length % books.length]);
      books = pool.map((b, i) => {
        const day = 1 + Math.floor(((i * 7 + (i % 5) * 3) % days));
        const end = new Date(viewYear, viewMonth, day);
        const start = new Date(end);
        start.setDate(start.getDate() - (spanOf({ title: (b.title || '') + i }) - 1));
        return { ...b, start, end, ongoing: false, date: end.toISOString().slice(0, 10) };
      });
    }
  } catch {
    grid.innerHTML = '<div class="msg">불러올 수 없어요 :(</div>';
    return;
  }

  // 이 달 그리드의 첫 칸(월요일 시작)
  const first = new Date(viewYear, viewMonth, 1);
  const offset = (first.getDay() + 6) % 7;          // 월=0
  const gridStart = new Date(viewYear, viewMonth, 1 - offset);
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const weeks = Math.ceil((offset + daysInMonth) / 7);
  const today = new Date();

  // ── 1단계: 주별로 어느 책이 몇 번째 줄에 놓일지 계산 ──
  const plan = [];
  let maxDone = 1;
  let maxNow = 0;

  for (let w = 0; w < weeks; w++) {
    const weekStart = new Date(gridStart);
    weekStart.setDate(gridStart.getDate() + w * 7);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);

    const inWeek = books
      .filter(b => b.end >= weekStart && b.start <= weekEnd)
      .sort((a, b) => a.start - b.start);

    const lanesDone = [];   // 완독 — 위에서부터
    const lanesNow = [];    // 읽는 중 — 아래에서부터
    const items = inWeek.map(b => {
      const s = Math.max(0, Math.round((b.start - weekStart) / 86400000));
      const e = Math.min(6, Math.round((b.end - weekStart) / 86400000));
      const stack = b.ongoing ? lanesNow : lanesDone;
      let lane = stack.findIndex(last => last < s);
      if (lane === -1) { stack.push(e); lane = stack.length - 1; }
      else stack[lane] = e;
      const endsHere = !b.ongoing && b.end >= weekStart && b.end <= weekEnd;
      return { b, s, e, lane, endsHere };
    });

    if (lanesDone.length > maxDone) maxDone = lanesDone.length;
    if (lanesNow.length > maxNow) maxNow = lanesNow.length;
    plan.push({ weekStart, items });
  }

  // ── 2단계: 스크롤이 생기지 않도록 한 주 높이와 표지 크기를 정한다 ──
  const gridTop = grid.getBoundingClientRect().top;
  const avail = window.innerHeight - gridTop - 36;
  const budget = Math.max(50, Math.floor(avail / weeks) - 5);

  let capH = showCover ? CAP_H : 0;
  // 표지는 칸 자체에 못 들어갈 때만 줄인다 (다른 요소 때문에 줄이지 않는다)
  if (capH && 40 + capH + 12 > budget) capH = Math.max(34, budget - 52);

  const lineBlock = showLine
    ? (maxDone - 1) * LANE_H + 22 + maxNow * LANE_H
    : 0;
  const need = 40 + Math.max(capH, lineBlock) + 12;
  const rowH = Math.max(50, Math.min(need, budget));

  // ── 3단계: 그리기 ──
  grid.innerHTML = '';
  const capJobs = [];

  plan.forEach(({ weekStart, items }) => {
    const weekEl = document.createElement('div');
    weekEl.className = 'week';

    const cells = document.createElement('div');
    cells.className = 'cells';
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart);
      d.setDate(weekStart.getDate() + i);
      const out = d.getMonth() !== viewMonth;
      const cell = document.createElement('div');
      cell.className = 'cell' + (out ? ' out' : '') + (sameDay(d, today) ? ' today' : '');
      cell.style.minHeight = rowH + 'px';
      cell.innerHTML = '<div class="num">' + String(d.getDate()).padStart(2, '0') + '</div>';
      cells.appendChild(cell);
    }
    weekEl.appendChild(cells);

    const laneBox = document.createElement('div');
    laneBox.className = 'lanes';
    laneBox.style.height = (rowH - 40) + 'px';

    items.forEach(({ b, s, e, lane, endsHere }) => {
      // 기간 실선 — 완독일 칸에서 끝날 때는 표지 뒤에서 끊는다
      const right = (endsHere && showCover) ? (e + 0.5) : (e + 1);
      const bar = showLine ? document.createElement('div') : null;
      if (bar) {
      bar.className = 'bar' + (b.ongoing ? ' now' : '');
      bar.style.left = (s / 7 * 100) + '%';
      bar.style.width = ((right - s) / 7 * 100) + '%';
      bar.style.height = BAR_H + 'px';
      if (b.ongoing) bar.style.bottom = (lane * LANE_H + 6) + 'px';
      else bar.style.top = (lane * LANE_H + 10) + 'px';
      bar.style.background = '#DADADA';
      bar.addEventListener('mouseenter', () => showPop(b));
      bar.addEventListener('mouseleave', hidePop);
      laneBox.appendChild(bar);
      }

      // 완독일 표지 — 막대 위치와 무관하게 항상 같은 높이
      if (endsHere && showCover) {
        const cap = document.createElement('div');
        cap.className = 'cap' + (b.url ? '' : ' ph');
        cap.style.left = ((e + 0.5) / 7 * 100) + '%';
        cap.style.top = (capH / 2) + 'px';
        cap.style.height = capH + 'px';
        if (!b.url) cap.style.width = Math.round(capH / 1.45) + 'px';
        if (b.url) cap.innerHTML = '<img src="' + b.url + '" alt="">';
        cap.addEventListener('mouseenter', () => showPop(b));
        cap.addEventListener('mouseleave', hidePop);
        laneBox.appendChild(cap);
      }

      if (b.url && bar) capJobs.push({ bar, url: b.url });
    });

    weekEl.appendChild(laneBox);
    grid.appendChild(weekEl);
  });

  // 실선 색 입히기 (6권씩 동시에)
  let cursor = 0;
  await Promise.all(
    Array.from({ length: Math.min(6, capJobs.length) }, async () => {
      while (cursor < capJobs.length) {
        const job = capJobs[cursor++];
        const c = await keyColor(job.url);
        if (c) job.bar.style.background = c;
      }
    })
  );
  saveCache();
}

// ── 이동 ────────────────────────────────────────
document.getElementById('prev').addEventListener('click', () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  render();
});
document.getElementById('next').addEventListener('click', () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  render();
});
document.getElementById('today').addEventListener('click', () => {
  const n = new Date();
  viewYear = n.getFullYear(); viewMonth = n.getMonth();
  render();
});
document.addEventListener('click', hidePop);

function syncToggles() {
  document.getElementById('tLine').classList.toggle('on', showLine);
  document.getElementById('tCover').classList.toggle('on', showCover);
  try { localStorage.setItem(VIEW_KEY, JSON.stringify({ line: showLine, cover: showCover })); } catch {}
}
document.getElementById('tLine').addEventListener('click', () => {
  showLine = !showLine; syncToggles(); render();
});
document.getElementById('tCover').addEventListener('click', () => {
  showCover = !showCover; syncToggles(); render();
});
syncToggles();

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 180);
});

const now = new Date();
viewYear = parseInt(qs.get('year')) || now.getFullYear();
viewMonth = qs.has('month') ? parseInt(qs.get('month')) - 1 : now.getMonth();
render();
</script>
</body>
</html>
